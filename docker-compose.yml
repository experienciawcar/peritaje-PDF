services:
  pdf-generator:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: python3 app.py
    develop:
      watch:
        - path: ./app.py
          action: sync
          target: /app/app.py
        - path: ./templates
          action: sync
          target: /app/templates
        - path: ./static
          action: sync
          target: /app/static 